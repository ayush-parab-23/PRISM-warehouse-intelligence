name: PRISM Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Build Bundle
        run: npm run build

      - name: Run Core Verification Tests (16 tests)
        run: npm test

      - name: Run API End-to-End Tests (17 tests)
        run: npm run test:api
